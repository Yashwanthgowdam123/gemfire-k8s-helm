# Namespace isolation. Everything not listed is denied (ingress AND egress).
# Allowed: same-namespace traffic, DNS, declared client namespaces -> locator/server,
# monitoring -> metrics. WAN to the partner site is in wan.yaml.
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gf.name" . }}-default
  labels: {{ include "gf.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
  - from: [ { podSelector: {} } ]                      # same namespace only
  {{- with .Values.networkPolicy.clientNamespaceLabels }}
  - from:
    {{- range . }}
    - namespaceSelector: { matchLabels: {{ toYaml . | nindent 8 }} }
    {{- end }}
    ports:
    - { protocol: TCP, port: {{ $.Values.ports.locator }} }
    - { protocol: TCP, port: {{ $.Values.ports.server }} }
  {{- end }}
  - from:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} } }
    ports:
    - { protocol: TCP, port: {{ .Values.ports.metrics }} }
  egress:
  - to: [ { podSelector: {} } ]                        # same namespace only
  - to:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }} } }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
{{- end }}

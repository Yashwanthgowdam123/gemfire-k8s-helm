{{/*
  The chart never creates or stores secret VALUES. It references Secrets by name, produced
  outside Git (External Secrets Operator, Vault, sealed secrets, ...):
    <release>-credentials  keys: username, password, security.json   (security.json: demo manager)
    <release>-tls          keys: keystore.p12, truststore.p12        (cert-manager PKCS12 output)
    <release>-tls-password keys: password                            (keystore/truststore password)
  Optional: let cert-manager issue the TLS Secret. The issuer is per ENVIRONMENT
  (gemfire-<env>-ca), so a mis-wired cross-environment WAN link fails TLS verification.
*/}}
{{- if and .Values.security.enabled .Values.security.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.site.tls.secretName }}
  labels: {{ include "gf.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.site.tls.secretName }}
  duration: 2160h
  renewBefore: 360h
  privateKey: { algorithm: RSA, size: 2048 }
  usages: [server auth, client auth]
  dnsNames:
  - {{ include "gf.name" . }}-locator.{{ .Release.Namespace }}.svc
  - "*.{{ include "gf.name" . }}-locator-hl.{{ .Release.Namespace }}.svc.{{ .Values.site.clusterDomain }}"
  - "*.{{ include "gf.name" . }}-server-hl.{{ .Release.Namespace }}.svc.{{ .Values.site.clusterDomain }}"
  issuerRef:
    name: {{ .Values.site.tls.issuerName }}
    kind: {{ .Values.security.tls.certManager.issuerKind }}
    group: cert-manager.io
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: {{ .Values.site.tls.passwordSecretName }}
        key: password
{{- end }}

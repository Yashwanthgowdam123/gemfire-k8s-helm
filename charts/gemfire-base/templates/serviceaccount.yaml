# One ServiceAccount per site. Geode never calls the Kubernetes API, so the token is not
# mounted and no Role/RoleBinding is created (least privilege). RBAC for humans/CI is
# granted per namespace outside the chart (docs/installation.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gf.name" . }}
  labels: {{ include "gf.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.image.pullSecrets }}
imagePullSecrets: {{ toYaml . | nindent 2 }}
{{- end }}
